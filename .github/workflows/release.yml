name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --locked

      - name: Build PdfEditor EXE
        run: uv run pyinstaller --clean --noconfirm --onefile --name PdfEditor src/pdfeditor/main/main.py

      - name: Build Updater EXE
        run: uv run pyinstaller --clean --noconfirm --onefile --name Updater src/pdfeditor/updater/main.py

      - name: Create Zip
        run: zip -r pdfeditor.zip dist/

      - name: Create Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run:
          gh release create "${{ github.ref_name }}" `
            "dist/pdfeditor.zip" `
            --title "PdfEditor ${{ github.ref_name }}" `
            --generate-notes